<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <!-- Background with dark radial gradients -->
  <rect width="1200" height="630" fill="#0B0C0F" />
  <circle cx="200" cy="150" r="300" fill="#A99BFF" fill-opacity="0.12" filter="blur(80px)" />
  <circle cx="1000" cy="480" r="350" fill="#69D6AF" fill-opacity="0.10" filter="blur(90px)" />
  <circle cx="600" cy="315" r="220" fill="#FA2D48" fill-opacity="0.06" filter="blur(100px)" />

  <!-- Outer frame border -->
  <rect x="30" y="30" width="1140" height="570" rx="24" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" />

  <!-- Badge -->
  <g transform="translate(80, 85)">
    <rect width="360" height="40" rx="20" fill="#1B1E28" stroke="#ffffff" stroke-opacity="0.12" />
    <circle cx="22" cy="20" r="5" fill="#69D6AF" />
    <text x="38" y="25" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14" font-weight="600" letter-spacing="0.5">
      UNIVERSAL PLAYLIST MIGRATION HUB
    </text>
  </g>

  <!-- Brand Title -->
  <g transform="translate(80, 210)">
    <text x="0" y="0" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="76" font-weight="800" letter-spacing="-1.5">
      TuneBridge
    </text>
    <text x="0" y="70" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="28" font-weight="500">
      Perpustakaan Musik Anda. Tersambung, Bersih, dan Utuh.
    </text>
  </g>

  <!-- Vinyl Icon Graphic on Right -->
  <g transform="translate(880, 315)">
    <circle cx="0" cy="0" r="160" fill="#12141A" stroke="#2B3040" stroke-width="4" />
    <circle cx="0" cy="0" r="120" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2" stroke-dasharray="6 6" />
    <circle cx="0" cy="0" r="80" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" />
    <circle cx="0" cy="0" r="45" fill="#A99BFF" fill-opacity="0.2" stroke="#A99BFF" stroke-width="3" />
    <circle cx="0" cy="0" r="16" fill="#A99BFF" />
  </g>

  <!-- Supported Platforms Row -->
  <g transform="translate(80, 480)">
    <rect width="180" height="50" rx="12" fill="#181B24" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="24" y="31" fill="#FF4D4D" font-family="sans-serif" font-size="16" font-weight="700">● YouTube Music</text>

    <g transform="translate(200, 0)">
      <rect width="160" height="50" rx="12" fill="#181B24" stroke="#ffffff" stroke-opacity="0.08" />
      <text x="24" y="31" fill="#FA2D48" font-family="sans-serif" font-size="16" font-weight="700">● Apple Music</text>
    </g>

    <g transform="translate(380, 0)">
      <rect width="140" height="50" rx="12" fill="#181B24" stroke="#ffffff" stroke-opacity="0.08" />
      <text x="24" y="31" fill="#1DB954" font-family="sans-serif" font-size="16" font-weight="700">● Spotify</text>
    </g>

    <g transform="translate(540, 0)">
      <rect width="210" height="50" rx="12" fill="#181B24" stroke="#ffffff" stroke-opacity="0.08" />
      <text x="24" y="31" fill="#69D6AF" font-family="sans-serif" font-size="16" font-weight="700">● MySQL Local-First</text>
    </g>
  </g>
</svg>
