services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: music2anywhere-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3080}:${APP_PORT:-3080}"
    environment:
      - APP_PORT=${APP_PORT:-3080}
      - NODE_ENV=production
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
