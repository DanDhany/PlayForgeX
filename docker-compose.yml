services:
  tunebridge-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tunebridge-app
    image: tunebridge-app:latest
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT:-3080}:${APP_PORT:-3080}"
    environment:
      - APP_PORT=${APP_PORT:-3080}
      - NODE_ENV=production
      - DATA_DIR=/app/data
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - DB_NAME=${DB_NAME:-tunebridge}
    volumes:
      - ./data:/app/data

  mysql:
    image: mysql:8.0
    container_name: tunebridge-mysql
    restart: unless-stopped
    profiles:
      - with-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tunebridge
    ports:
      - "3306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
